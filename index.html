<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#3B4B59" />

    <!-- SEO Meta Tags -->
    <title>JodiMini - متجر ملابس أطفال سعودي</title>
    <meta
      name="description"
      content="صفحة هبوط تفاعلية لمتجر ملابس الأطفال السعودي JodiMini مع تجربة تسوق سريعة، ميزة تطريز الاسم وسلة مشتريات ذكية"
    />
    <meta name="keywords" content="ملابس أطفال, فساتين أطفال, تطريز اسم, ملابس رضع, JodiMini, أزياء أطفال سعودية, ملابس ولادي, ملابس بناتي" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="JodiMini - متجر ملابس أطفال سعودي" />
    <meta
      property="og:description"
      content="صفحة هبوط تفاعلية لمتجر ملابس الأطفال السعودي JodiMini مع تجربة تسوق سريعة، ميزة تطريز الاسم وسلة مشتريات ذكية"
    />
    <meta property="og:image" content="./images/og-image.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JodiMini - متجر ملابس أطفال سعودي" />
    <meta
      name="twitter:description"
      content="صفحة هبوط تفاعلية لمتجر ملابس الأطفال السعودي JodiMini مع تجربة تسوق سريعة، ميزة تطريز الاسم وسلة مشتريات ذكية"
    />
    <meta name="twitter:image" content="./images/og-image.jpg" />

    <!-- PWA & Mobile Web App Meta -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="JodiMini" />

    <!-- Favicon & Apple Touch Icons -->
    <link rel="icon" type="image/png" href="./images/logo.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="./pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="./pwa-512x512.png" />

    <!-- Preload Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Static Production Stylesheets (Immediate render-blocking load for all devices) -->
    <link rel="stylesheet" href="./assets/style.css" />
    <link rel="stylesheet" href="./assets/style2.css" />

    <!-- Critical Mobile Safety & Responsive Reset (Prevents viewport blowout on any connection) -->
    <style>
      html {
        -webkit-text-size-adjust: 100%;
        font-family: 'Baloo Bhaijaan 2', system-ui, -apple-system, sans-serif;
        background-color: #FBF8F4;
      }
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden;
        background-color: #FBF8F4;
        color: #3B4B59;
        font-family: 'Baloo Bhaijaan 2', system-ui, -apple-system, sans-serif;
      }
      *, *::before, *::after {
        box-sizing: border-box;
      }
      img, video, svg, canvas {
        max-width: 100% !important;
        height: auto;
      }
      #root {
        width: 100%;
        min-height: 100vh;
        overflow-x: hidden;
      }
    </style>

    <!-- Immediate Zero-Delay PWA Standalone Detection & Element Hiding -->
    <script>
      (function() {
        try {
          var s = window.location.search.toLowerCase();
          var h = window.location.hash.toLowerCase();
          var isStandalone = (
            s.indexOf('source=pwa') !== -1 ||
            s.indexOf('mode=standalone') !== -1 ||
            s.indexOf('source=homescreen') !== -1 ||
            s.indexOf('pwa=true') !== -1 ||
            h.indexOf('pwa') !== -1 ||
            window.matchMedia('(display-mode: standalone)').matches ||
            window.matchMedia('(display-mode: fullscreen)').matches ||
            window.matchMedia('(display-mode: minimal-ui)').matches ||
            (window.navigator && window.navigator.standalone === true) ||
            document.referrer.indexOf('android-app://') !== -1 ||
            localStorage.getItem('jodimini_app_installed') === 'true' ||
            sessionStorage.getItem('jodimini_app_installed') === 'true' ||
            document.cookie.indexOf('jodimini_app_installed=true') !== -1
          );

          if (isStandalone) {
            document.documentElement.classList.add('app-is-installed');
            try {
              localStorage.setItem('jodimini_app_installed', 'true');
              sessionStorage.setItem('jodimini_app_installed', 'true');
              document.cookie = 'jodimini_app_installed=true; max-age=31536000; path=/; SameSite=Lax';
            } catch(e) {}
            var style = document.createElement('style');
            style.innerHTML = '.app-is-installed [data-pwa-install], .app-is-installed .pwa-install-element { display: none !important; }';
            document.head.appendChild(style);
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FBF8F4] text-[#3B4B59] antialiased selection:bg-[#F497A9]/30 selection:text-[#3B4B59] min-h-screen">
    <div id="root"></div>

    <!-- Universal Smart Script Loader (Dev server on port 3000 vs Production static hosting) -->
    <script type="module">
      const isDevServer = Boolean(
        (window.location.port === '3000' || window.location.port === '5173') &&
        (window.location.hostname === 'localhost' ||
         window.location.hostname === '127.0.0.1' ||
         window.location.hostname.includes('.run.app'))
      );

      if (isDevServer) {
        import('/src/main.tsx').catch(function(err) {
          console.error('JodiMini dev load error:', err);
        });
      } else {
        // Production static hosting (GitHub Pages, jodimini-demo.codix.uk, Apache, Nginx)
        import('./assets/main.js').catch(function(err) {
          console.error('JodiMini production bundle load error:', err);
        });
      }
    </script>
  </body>
</html>
