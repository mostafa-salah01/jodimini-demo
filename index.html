<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#3B4B59" />

    <!-- SEO Meta Tags -->
    <title>JodiMini - متجر ملابس أطفال سعودي</title>
    <meta
      name="description"
      content="صفحة هبوط تفاعلية لمتجر ملابس الأطفال السعودي JodiMini مع تجربة تسوق سريعة، ميزة تطريز الاسم وسلة مشتريات ذكية"
    />
    <meta name="keywords" content="ملابس أطفال, فساتين أطفال, تطريز اسم, ملابس رضع, JodiMini, أزياء أطفال سعودية, ملابس ولادي, ملابس بناتي" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="JodiMini - متجر ملابس أطفال سعودي" />
    <meta
      property="og:description"
      content="صفحة هبوط تفاعلية لمتجر ملابس الأطفال السعودي JodiMini مع تجربة تسوق سريعة، ميزة تطريز الاسم وسلة مشتريات ذكية"
    />
    <meta property="og:image" content="./images/og-image.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JodiMini - متجر ملابس أطفال سعودي" />
    <meta
      name="twitter:description"
      content="صفحة هبوط تفاعلية لمتجر ملابس الأطفال السعودي JodiMini مع تجربة تسوق سريعة، ميزة تطريز الاسم وسلة مشتريات ذكية"
    />
    <meta name="twitter:image" content="./images/og-image.jpg" />

    <!-- PWA & Mobile Web App Meta -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="JodiMini" />

    <!-- Favicon & Apple Touch Icons -->
    <link rel="icon" type="image/png" href="./images/logo.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="./pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="./pwa-512x512.png" />

    <!-- Preload Hero Poster for ultra-fast LCP -->
    <link rel="preload" as="image" href="./images/hero-poster.webp" type="image/webp" fetchpriority="high" />

    <!-- Fonts: Baloo Bhaijaan 2 for Arabic & Latin round elegance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#FBF8F4] text-[#3B4B59] antialiased selection:bg-[#F497A9]/30 selection:text-[#3B4B59] min-h-screen">
    <div id="root"></div>

    <!-- Development entrypoint for Vite dev server -->
    <script
      type="module"
      src="./src/main.tsx"
      onerror="window.__loadStaticBundle && window.__loadStaticBundle()"
    ></script>

    <!-- Immediate static fallback for GitHub Pages hosting where raw .tsx cannot execute -->
    <script>
      window.__loadStaticBundle = function() {
        if (window.__static_bundle_loaded) return;
        window.__static_bundle_loaded = true;
        if (!document.querySelector('link[href*="style.css"]')) {
          var c = document.createElement('link');
          c.rel = 'stylesheet';
          c.crossOrigin = 'anonymous';
          c.href = './assets/style.css';
          document.head.appendChild(c);
        }
        var s = document.createElement('script');
        s.type = 'module';
        s.crossOrigin = 'anonymous';
        s.src = './assets/app.js';
        document.body.appendChild(s);
      };
      // If root is still empty after 250ms (when a static server fails to parse .tsx), boot bundle
      setTimeout(function() {
        var root = document.getElementById('root');
        if (root && root.children.length === 0) {
          window.__loadStaticBundle();
        }
      }, 250);
    </script>
  </body>
</html>
