    <!-- PWA & Mobile Web App Meta -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="JodiMini" />

    <!-- Favicon & Apple Touch Icons -->
    <link rel="icon" type="image/png" href="./assets/logo.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="./pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="./pwa-512x512.png" />

    <!-- Preload Hero Poster for ultra-fast LCP -->
    <link rel="preload" as="image" href="./assets/hero-poster.webp" type="image/webp" fetchpriority="high" />

    <!-- Fonts: Baloo Bhaijaan 2 for Arabic & Latin round elegance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Immediate Zero-Delay PWA Standalone Detection & Element Hiding -->
    <script>
      (function() {
        try {
          var s = window.location.search.toLowerCase();
          var h = window.location.hash.toLowerCase();
          var isStandalone = (
            s.indexOf('source=pwa') !== -1 ||
            s.indexOf('mode=standalone') !== -1 ||
            s.indexOf('source=homescreen') !== -1 ||
            s.indexOf('pwa=true') !== -1 ||
            h.indexOf('pwa') !== -1 ||
            window.matchMedia('(display-mode: standalone)').matches ||
            window.matchMedia('(display-mode: fullscreen)').matches ||
            window.matchMedia('(display-mode: minimal-ui)').matches ||
            (window.navigator && window.navigator.standalone === true) ||
            document.referrer.indexOf('android-app://') !== -1 ||
            localStorage.getItem('jodimini_app_installed') === 'true' ||
            sessionStorage.getItem('jodimini_app_installed') === 'true' ||
            document.cookie.indexOf('jodimini_app_installed=true') !== -1
          );

          if (isStandalone) {
            document.documentElement.classList.add('app-is-installed');
            try {
              localStorage.setItem('jodimini_app_installed', 'true');
              sessionStorage.setItem('jodimini_app_installed', 'true');
              document.cookie = 'jodimini_app_installed=true; max-age=31536000; path=/; SameSite=Lax';
            } catch(e) {}
            var style = document.createElement('style');
            style.innerHTML = '.app-is-installed [data-pwa-install], .app-is-installed .pwa-install-element { display: none !important; }';
            document.head.appendChild(style);
          }
        } catch(e) {}
      })();
    </script>
    <script type="module" crossorigin src="./assets/app.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/style.css">
  <link rel="manifest" href="./manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="./registerSW.js"></script></head>
  <body class="bg-[#FBF8F4] text-[#3B4B59] antialiased selection:bg-[#F497A9]/30 selection:text-[#3B4B59] min-h-screen">
    <div id="root"></div>

    <!-- Development entrypoint for Vite dev server -->

    <!-- Immediate static fallback for GitHub Pages hosting where raw .tsx cannot execute -->
    <script>
      window.__loadStaticBundle = function() {
        if (window.__static_bundle_loaded) return;
        window.__static_bundle_loaded = true;
        if (!document.querySelector('link[href*="style.css"]')) {
          var c = document.createElement('link');
          c.rel = 'stylesheet';
          c.crossOrigin = 'anonymous';
          c.href = './assets/style.css';
          document.head.appendChild(c);
        }
        var s = document.createElement('script');
        s.type = 'module';
        s.crossOrigin = 'anonymous';
        s.src = './assets/app.js';
        document.body.appendChild(s);
      };
      // If root is still empty after 250ms (when a static server fails to parse .tsx), boot bundle
      setTimeout(function() {
        var root = document.getElementById('root');
        if (root && root.children.length === 0) {
          window.__loadStaticBundle();
        }
      }, 250);
    </script>
  </body>
</html>
